name: Sync Upstream and Build Docker
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      update_msg: ${{ steps.check.outputs.update_msg }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/chiihero/Microsoft-Rewards-Script.git
          git fetch upstream main
          git checkout main
          git merge upstream/main --no-edit --allow-unrelated-histories || true
          git push origin main || true
        continue-on-error: true

      - name: Check for updates
        id: check
        run: |
          DIFF=$(git log HEAD..upstream/main --oneline 2>/dev/null)
          if [ -z "$DIFF" ]; then
            echo "has_update=false" >> $GITHUB_OUTPUT
            echo "update_msg=当前已是最新版本，无需更新" >> $GITHUB_OUTPUT
          else
            echo "has_update=true" >> $GITHUB_OUTPUT
            MSG="发现上游更新，已同步：$(echo "$DIFF" | head -5 | tr '\n' '; ')"
            echo "update_msg=$MSG" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.has_update == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest

      - name: PushPlus - 构建成功
        if: (github.event_name == 'workflow_dispatch' || steps.check.outputs.has_update == 'true') && success()
        run: |
          curl -s -X POST "http://www.pushplus.plus/send" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${{ secrets.PUSHPLUS_TOKEN }}\",\"title\":\"✅ Microsoft-Rewards-Script 构建成功\",\"content\":\"${{ steps.check.outputs.update_msg }}\\n镜像已推送 ghcr.io\"}"

      - name: PushPlus - 无需更新
        if: github.event_name != 'workflow_dispatch' && steps.check.outputs.has_update == 'false'
        run: |
          curl -s -X POST "http://www.pushplus.plus/send" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${{ secrets.PUSHPLUS_TOKEN }}\",\"title\":\"🔄 Microsoft-Rewards-Script 检查完成\",\"content\":\"${{ steps.check.outputs.update_msg }}\\n镜像保持最新\"}"
