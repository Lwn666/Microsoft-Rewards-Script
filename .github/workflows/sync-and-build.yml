name: Sync Upstream and Build Docker
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/chiihero/Microsoft-Rewards-Script.git
          git fetch upstream main
          git checkout main
          git merge upstream/main --no-edit --allow-unrelated-histories
          git push origin main
        continue-on-error: true
      - name: Check for changes
        id: check
        run: |
          LAST_COMMIT=$(git log -1 --format='%H')
          echo "last_commit=$LAST_COMMIT" >> $GITHUB_OUTPUT
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.check.outputs.last_commit }}
